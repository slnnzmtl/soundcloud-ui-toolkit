<!DOCTYPE html>
<html lang="en" class="scx-theme-default scx-radius-md">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoundCloud UI Toolkit</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="control-center">
      <header class="control-center__header">
        <h1 class="control-center__title">SoundCloud UI Toolkit</h1>
        <label class="switch-row switch-row--compact" for="extension-enabled">
          <span class="switch-row__label">Enabled</span>
          <input
            id="extension-enabled"
            class="switch-row__input"
            type="checkbox"
            role="switch"
          />
          <span class="switch-row__track" aria-hidden="true">
            <span class="switch-row__thumb"></span>
          </span>
        </label>
      </header>

      <div id="control-center-body" class="control-center__body">
      <section class="control-center__group" aria-labelledby="features-heading">
        <h2 id="features-heading" class="control-center__group-title">
          Features
        </h2>

        <div class="feature-list">
          <label class="switch-row" for="full-width">
            <span class="switch-row__label">Enlarged layout</span>
            <input
              id="full-width"
              class="switch-row__input"
              type="checkbox"
              role="switch"
            />
            <span class="switch-row__track" aria-hidden="true">
              <span class="switch-row__thumb"></span>
            </span>
          </label>

          <label class="switch-row" for="enlarged-queue">
            <span class="switch-row__label">Enlarged queue</span>
            <input
              id="enlarged-queue"
              class="switch-row__input"
              type="checkbox"
              role="switch"
            />
            <span class="switch-row__track" aria-hidden="true">
              <span class="switch-row__thumb"></span>
            </span>
          </label>
        </div>
      </section>

      <section
        class="control-center__group"
        aria-labelledby="appearance-heading"
      >
        <h2 id="appearance-heading" class="control-center__group-title">
          Appearance
        </h2>

        <div class="radius-field">
          <span id="radius-heading" class="radius-field__label">Rounding</span>
          <div
            id="radius-list"
            class="radius-list"
            role="radiogroup"
            aria-labelledby="radius-heading"
          ></div>
        </div>

        <div
          class="theme-mode"
          role="radiogroup"
          aria-labelledby="theme-mode-label"
        >
          <span id="theme-mode-label" class="theme-mode__label">Colors</span>
          <div class="theme-mode__options">
            <label class="theme-mode__option">
              <input
                class="theme-mode__input"
                type="radio"
                name="theme-mode"
                value="presets"
                checked
              />
              <span class="theme-mode__chip">Presets</span>
            </label>
            <label class="theme-mode__option">
              <input
                class="theme-mode__input"
                type="radio"
                name="theme-mode"
                value="custom"
              />
              <span class="theme-mode__chip">Custom</span>
            </label>
          </div>
        </div>

        <div
          id="theme-list"
          class="theme-list"
          role="radiogroup"
          aria-labelledby="appearance-heading"
        ></div>

        <div id="custom-theme-panel" class="custom-theme" hidden>
          <div
            class="custom-theme__preview"
            id="custom-theme-preview"
            aria-hidden="true"
          >
            <span class="custom-theme__preview-surface"></span>
            <span class="custom-theme__preview-accent"></span>
            <span class="custom-theme__preview-text">Aa</span>
          </div>

          <div class="custom-theme__fields" id="custom-theme-fields"></div>

          <p
            id="custom-theme-contrast"
            class="custom-theme__contrast"
            role="status"
          ></p>

          <div class="custom-theme__actions">
            <button type="button" class="custom-theme__btn" id="custom-reset">
              Reset colors
            </button>
          </div>
        </div>
      </section>
      </div>
    </main>

    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
